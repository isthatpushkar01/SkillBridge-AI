<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="none">
  <defs>
    <linearGradient id="sRibbonGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="35%" stop-color="#7138E8" />
      <stop offset="70%" stop-color="#580AD0" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sRibbonLightIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="goldCapGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="swooshGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shadowGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#580AD0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Lower orbital swoosh -->
    <path d="M 50 185 C 30 195, 60 220, 110 215 C 170 210, 220 165, 225 145 C 228 135, 215 138, 205 145 C 175 168, 120 190, 75 185 Z" 
          fill="url(#swooshGradIcon)" opacity="0.9" filter="url(#shadowGlowIcon)"/>

    <!-- 3D 'S' Ribbon Body -->
    <path d="M 175 80 C 185 105, 175 125, 145 135 C 120 145, 95 145, 80 155 C 65 165, 65 185, 90 200 C 115 215, 150 205, 175 185 L 185 200 C 150 225, 100 230, 65 205 C 40 185, 40 155, 65 135 C 88 118, 120 115, 140 105 C 155 95, 158 85, 148 72 C 135 55, 100 60, 80 75 L 70 58 C 100 35, 155 35, 175 80 Z" 
          fill="url(#sRibbonGradIcon)" filter="url(#shadowGlowIcon)"/>

    <!-- Glossy Fold on S -->
    <path d="M 140 105 C 160 120, 135 145, 105 152 C 80 158, 65 175, 75 190 C 80 198, 92 205, 110 208 C 88 205, 72 195, 68 180 C 65 165, 78 152, 98 145 C 125 136, 150 125, 140 105 Z" 
          fill="url(#sRibbonLightIcon)" opacity="0.7"/>

    <!-- Suspension Bridge inside S (White with cables) -->
    <g transform="translate(62, 118)">
      <path d="M 10 40 Q 60 25 110 40 L 110 44 Q 60 29 10 44 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M 10 42 Q 60 27 110 42" stroke="#CBD5E1" stroke-width="1.5" fill="none"/>

      <!-- Twin Towers -->
      <path d="M 52 10 L 56 10 L 58 42 L 50 42 Z" fill="#1E293B"/>
      <path d="M 68 10 L 72 10 L 74 42 L 66 42 Z" fill="#1E293B"/>
      <line x1="53" y1="18" x2="71" y2="18" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="54" y1="28" x2="70" y2="28" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Cables -->
      <path d="M 12 40 Q 54 12 60 10 Q 66 12 108 40" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <line x1="25" y1="36" x2="25" y2="42" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="38" y1="28" x2="38" y2="41" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="82" y1="28" x2="82" y2="41" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="95" y1="36" x2="95" y2="42" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>

    <!-- Navy Graduation Cap with Golden Tassel -->
    <g transform="translate(45, 0)">
      <polygon points="75,5 145,28 75,52 5,28" fill="#0F172A" filter="url(#shadowGlowIcon)"/>
      <polygon points="75,8 140,28 75,48 10,28" fill="#1E1B4B"/>
      <path d="M 38 38 C 38 38, 48 60, 75 60 C 102 60, 112 38, 112 38 L 110 32 C 100 48, 80 50, 75 50 C 70 50, 50 48, 40 32 Z" fill="#0F172A"/>
      <path d="M 40 40 C 52 52, 98 52, 110 40 L 109 43 C 97 55, 53 55, 41 43 Z" fill="url(#goldCapGradIcon)"/>
      <ellipse cx="75" cy="28" rx="4" ry="2.5" fill="#F59E0B"/>
      <path d="M 75 28 C 90 26, 115 40, 120 62 L 122 80" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 117 78 L 126 78 L 128 98 C 128 102, 115 102, 115 98 Z" fill="url(#goldCapGradIcon)"/>
    </g>
  </g>
</svg>
